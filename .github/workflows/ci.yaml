name: Registry push

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - 'main'

concurrency:
  group: registry-push
  cancel-in-progress: true

jobs:
  branch-name:
    name: Validate requirement branch suffix
    runs-on: ubuntu-latest
    steps:
      - name: Require a positive requirement ID suffix
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$PR_SOURCE_BRANCH" =~ -[1-9][0-9]*$ ]]; then
            echo '::error::PR source branch must end with a positive requirement ID, for example feat/desktop-login-alignment-2600.'
            exit 1
          fi

  lint:
    needs: [branch-name]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Test assistant binding synchronization
        run: pnpm exec jest src/hooks/useApplications.test.ts src/hooks/useApplicationSessions.test.ts src/page/settings/tabs/applications src/page/settings/SettingsBindingLifecycle.test.tsx --runInBand

      - name: Test docs appearance synchronization
        run: pnpm exec jest src/lib/docsAppearance.test.ts src/layout/index.test.tsx src/layout/authStorage.test.ts --runInBand

      - name: Test anonymous captcha entry
        run: pnpm exec jest src/page/captcha/CaptchaPage.test.tsx src/hooks/useCaptcha.test.tsx src/lib/captcha.test.ts --runInBand

      - name: Test auth agreement consent
        run: pnpm exec jest src/page/user --runInBand

      - name: Test chat error telemetry
        run: pnpm exec jest src/lib/chatErrorTracking.test.ts src/lib/traceOutbox.test.ts src/lib/sendTrackEvent.retry.test.ts src/lib/sendTrackEvent.chat.test.ts src/lib/request.traceScope.test.ts src/components/omnibox/ChatErrorText.test.tsx src/page/chat/messages/MessageFailureFeedback.test.tsx --runInBand

      - name: Test chat stream recovery
        run: pnpm exec jest src/lib/chatErrors.test.ts src/lib/streamTransport.test.ts src/page/chat/conversation src/page/chat/core src/page/shared-chat src/page/chat/messages/answerTiming.test.tsx src/page/chat/messages/index.test.tsx src/page/chat/messages/role/AssistantDuration.test.tsx --runInBand

      - name: Test invite referral tracking
        run: pnpm exec jest src/page/inviteReferral/InviteReferralEntryExposure.test.tsx src/page/inviteReferral/tracking.test.ts src/lib/sendTrackEvent.test.ts --runInBand

  docker:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/import-ai/omnibox-web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_CHAT_HOME_DEFAULT_INPUT_ZH=${{ vars.VITE_CHAT_HOME_DEFAULT_INPUT_ZH }}
            VITE_CHAT_HOME_DEFAULT_INPUT_EN=${{ vars.VITE_CHAT_HOME_DEFAULT_INPUT_EN }}
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

  webhook:
    runs-on: ubuntu-latest
    needs: [ docker ]
    steps:
      - name: TEST push webhook
        if: github.event_name == 'push'
        env:
          WEBHOOK_URL: ${{ secrets.DEV_WEBHOOK_URL }}
          API_KEY: ${{ secrets.DEV_WEBHOOK_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          REF_LINK_TEXT="${REF}"
          REF_LINK_URL="${{ github.server_url }}/${{ github.repository }}/tree/${REF}"
          curl "${WEBHOOK_URL}/test?module=web&ref=${REF}&commit=${GITHUB_SHA}&tag=sha-${GITHUB_SHA::7}&run_url=${RUN_URL}&ref_link_text=${REF_LINK_TEXT}&ref_link_url=${REF_LINK_URL}" -H "Authorization: Bearer ${API_KEY}"

      - name: Deploy pull request to test
        if: github.event_name == 'pull_request'
        env:
          WEBHOOK_URL: ${{ secrets.DEV_WEBHOOK_URL }}
          API_KEY: ${{ secrets.DEV_WEBHOOK_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          REF_LINK_TEXT="pr-${PR_NUMBER}"
          REF_LINK_URL="${{ github.server_url }}/${{ github.repository }}/pull/${PR_NUMBER}"
          curl --fail-with-body --show-error "${WEBHOOK_URL}/test?module=web&ref=${REF}&commit=${HEAD_SHA}&tag=sha-${GITHUB_SHA::7}&run_url=${RUN_URL}&ref_link_text=${REF_LINK_TEXT}&ref_link_url=${REF_LINK_URL}" -H "Authorization: Bearer ${API_KEY}"
